<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FarmWise Pro — Smart Farm Management</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="FarmWise" />
<meta name="theme-color" content="#0F5B4E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230F5B4E'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle'%3E%F0%9F%90%84%3C/text%3E%3C/svg%3E" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230F5B4E'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle'%3E%F0%9F%90%84%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --sidebar: #0F5B4E;
    --sidebar-hover: rgba(255,255,255,0.08);
    --accent: #E8A33D;
    --bg: #F1F4F3;
    --card: #FFFFFF;
    --text: #1F2937;
    --text-muted: #6B7280;
    --hairline: #E5E9E8;
    --green: #059669; --green-bg: #D1FAE5;
    --blue: #2563EB; --blue-bg: #DBEAFE;
    --orange: #D97706; --orange-bg: #FEF3C7;
    --red: #DC2626; --red-bg: #FEE2E2;
    --purple: #7C3AED; --purple-bg: #EDE9FE;
    --teal: #0D9488; --teal-bg: #CCFBF1;
    --indigo: #4F46E5; --indigo-bg: #E0E7FF;
    --shadow: 0 1px 3px rgba(15,91,78,0.08), 0 1px 2px rgba(15,91,78,0.06);
    --shadow-md: 0 4px 14px rgba(15,91,78,0.10);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  body.lang-ur { font-family: "Jameel Noori Nastaleeq", "Noto Nastaliq Urdu", Tahoma, "Segoe UI", -apple-system, sans-serif; }
  #shell { display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  aside#sidebar {
    width: 250px; background: var(--sidebar); color: #fff; flex-shrink: 0;
    display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; z-index: 20;
  }
  html[dir="rtl"] aside#sidebar { left: auto; right: 0; }
  .brand-block { padding: 20px 20px 14px; }
  .brand-block .brand { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .brand-block .sub { font-size: 11px; opacity: 0.7; margin-top: 3px; }
  .lang-switch { display: flex; gap: 0; margin: 14px 20px 6px; border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; overflow: hidden; }
  .lang-switch button {
    flex: 1; background: none; border: none; color: rgba(255,255,255,0.75); padding: 7px 0; font-size: 12px;
    cursor: pointer; font-family: inherit; font-weight: 600;
  }
  .lang-switch button.active { background: var(--accent); color: #1F2937; }
  nav#navlist { padding: 6px 10px; flex: 1; overflow-y: auto; }
  nav#navlist button {
    width: 100%; text-align: left; background: none; border: none; color: rgba(255,255,255,0.85);
    padding: 11px 12px; font-size: 13.5px; border-radius: 8px; margin-bottom: 2px; cursor: pointer;
    display: flex; align-items: center; gap: 10px; font-family: inherit; border-left: 3px solid transparent;
  }
  html[dir="rtl"] nav#navlist button { text-align: right; border-left: none; border-right: 3px solid transparent; }
  nav#navlist button:hover { background: var(--sidebar-hover); }
  nav#navlist button.active { background: rgba(255,255,255,0.12); color: #fff; font-weight: 700; border-left: 3px solid var(--accent); }
  html[dir="rtl"] nav#navlist button.active { border-left: none; border-right: 3px solid var(--accent); }
  nav#navlist button .ic { font-size: 15px; width: 18px; text-align: center; }

  /* ---------- Main ---------- */
  main#main { margin-left: 250px; flex: 1; padding: 26px 30px 60px; max-width: 1200px; }
  html[dir="rtl"] main#main { margin-left: 0; margin-right: 250px; }
  .page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
  .page-header h1 { font-size: 24px; margin: 0; font-weight: 800; color: var(--text); }
  .page-header .sub { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
  .page-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .abtn { padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; font-family: inherit; }
  .abtn.light { background: #fff; color: var(--text); border: 1px solid var(--hairline); box-shadow: var(--shadow); }
  .abtn.danger { background: #DC2626; color: #fff; }

  /* ---------- KPI cards ---------- */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 22px; }
  .kpi-card { background: var(--card); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); }
  .kpi-badge { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 12px; }
  .kpi-value { font-size: 24px; font-weight: 800; color: var(--text); line-height: 1.1; }
  .kpi-label { font-size: 12.5px; color: var(--text-muted); margin-top: 6px; }
  .kpi-trend { font-size: 11.5px; margin-top: 8px; font-weight: 600; }
  .kpi-trend.up { color: var(--green); } .kpi-trend.down { color: var(--red); } .kpi-trend.flat { color: var(--text-muted); }

  /* ---------- Panels ---------- */
  .panel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 20px; }
  @media (max-width: 900px) { .panel-grid { grid-template-columns: 1fr; } }
  .panel { background: var(--card); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); }
  .panel h3 { font-size: 14px; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
  .panel .empty-chart { font-size: 12.5px; color: var(--text-muted); padding: 30px 0; text-align: center; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--text-muted); }
  .legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 5px; }
  html[dir="rtl"] .legend .dot { margin-right: 0; margin-left: 5px; }

  /* ---------- Forms ---------- */
  .card { background: var(--card); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 20px; }
  h3.section { font-size: 14px; font-weight: 700; margin: 0 0 12px; }
  .field { margin-bottom: 14px; }
  .field label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; padding: 10px 11px; border: 1px solid var(--hairline); border-radius: 8px;
    font-size: 14px; color: var(--text); background: #fff; font-family: inherit;
  }
  html[dir="rtl"] .field input[type="number"], html[dir="rtl"] .field input[type="date"] { direction: ltr; text-align: right; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--sidebar); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn {
    width: 100%; padding: 12px 0; border: none; border-radius: 9px; font-size: 13.5px; font-weight: 700;
    cursor: pointer; background: var(--sidebar); color: #fff; margin-bottom: 4px; font-family: inherit;
  }
  .btn.ghost { background: #fff; color: var(--red); border: 1px solid var(--hairline); }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--hairline); }
  .row .del { background: none; border: none; color: var(--red); font-size: 11.5px; cursor: pointer; }
  .note { padding: 12px 14px; background: var(--orange-bg); border-left: 3px solid var(--orange); border-radius: 8px; font-size: 12px; line-height: 1.55; margin-bottom: 16px; }
  html[dir="rtl"] .note { border-left: none; border-right: 3px solid var(--orange); }
  .alert { padding: 11px 13px; background: var(--red-bg); border-left: 3px solid var(--red); border-radius: 8px; margin-bottom: 8px; }
  html[dir="rtl"] .alert { border-left: none; border-right: 3px solid var(--red); }
  .alert.good { background: var(--green-bg); border-color: var(--green); }
  .alert.warn { background: var(--orange-bg); border-color: var(--orange); }
  .alert.info { background: var(--indigo-bg); border-color: var(--indigo); }
  .choice { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .choice button { padding: 8px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; border: 1px solid var(--hairline); background: #fff; color: var(--text); font-family: inherit; }
  .choice button.active { background: var(--sidebar); color: #fff; border-color: var(--sidebar); }
  .pricing-option { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 10px; margin-bottom: 8px; border: 1px solid var(--hairline); cursor: pointer; }
  .pricing-option.selected { border-color: var(--sidebar); background: #EAF3F0; }
  .tick { width: 18px; height: 18px; border-radius: 5px; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; border: 2px solid var(--hairline); }
  .tick.on { background: var(--sidebar); border-color: var(--sidebar); }
  .pill-title { font-size: 12.5px; font-weight: 700; }
  .pill-desc { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
  .muted { font-size: 12px; color: var(--text-muted); }
  .empty { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
  .divider { height: 20px; }

  /* ---------- Mobile ---------- */
  @media print {
    aside#sidebar, .page-actions, .lang-switch, nav#navlist { display: none !important; }
    main#main { margin: 0 !important; padding: 0 !important; max-width: 100% !important; }
    .card, .kpi-row, .page-header .sub { box-shadow: none !important; }
    body { background: #fff !important; }
    #printableReport { box-shadow: none !important; border: none !important; }
    .grid2:has(input[type="date"]) { display: none !important; }
  }
  @media (max-width: 860px) {
    aside#sidebar { width: 100%; height: auto; position: sticky; top: 0; flex-direction: row; align-items: center; overflow-x: auto; padding: 0; }
    .brand-block { padding: 12px 14px; flex-shrink: 0; }
    .brand-block .sub { display: none; }
    .lang-switch { margin: 0 8px; flex-shrink: 0; width: 110px; }
    nav#navlist { display: flex; padding: 6px 8px; overflow-x: auto; flex: none; }
    nav#navlist button { flex-direction: column; white-space: nowrap; border-left: none; border-bottom: 3px solid transparent; }
    nav#navlist button.active { border-left: none; border-bottom: 3px solid var(--accent); }
    main#main { margin-left: 0 !important; margin-right: 0 !important; padding: 18px 16px 50px; }
    #shell { flex-direction: column; }
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div id="shell">
  <aside id="sidebar">
    <div class="brand-block">
      <div class="brand" id="brandText"></div>
      <div class="sub" id="brandSub"></div>
    </div>
    <div class="lang-switch">
      <button id="langBtnEn" onclick="setLanguage('en')">English</button>
      <button id="langBtnUr" onclick="setLanguage('ur')">اردو</button>
    </div>
    <nav id="navlist"></nav>
  </aside>
  <main id="main"></main>
</div>

<script>
// ================= STORAGE =================
const KEYS = {
  bandi: "bandi-setup", rates: "rate-book", animals: "animals",
  ledger: "milk-ledger", feedItems: "feed-items", feedUsage: "feed-usage",
  medical: "medical-events", tests: "animal-tests", settings: "settings",
  parties: "parties", payments: "payments", feedPurchases: "feed-purchases",
};
function farmStorageKey(suffix) { return `farmwise:${currentFarmId}:${suffix}`; }
function load(suffix, fallback) { try { const v = localStorage.getItem(farmStorageKey(suffix)); return v ? JSON.parse(v) : fallback; } catch(e) { return fallback; } }

const DEFAULT_BANDI = {
  "Cow-Morning": { pricingMode: "mixed", quotaMun: 6, fixedRate: 210, commissionPct: 0 },
  "Cow-Evening": { pricingMode: "mixed", quotaMun: 6, fixedRate: 210, commissionPct: 0 },
  "Buffalo-Morning": { pricingMode: "mixed", quotaMun: 10, fixedRate: 260, commissionPct: 0 },
  "Buffalo-Evening": { pricingMode: "mixed", quotaMun: 10, fixedRate: 260, commissionPct: 0 },
};
const DEFAULT_SETTINGS = { alertDropPct: 15, species: "both", targetCostPerLitre: 18, lowStockKg: 20, testIntervalDays: 10 };

// ============================================================
// SYNC — entirely optional. The app works fully offline without it.
// Turning it on (from Setup → Sync) connects to a Firebase project
// so the same data shows up on every device that connects to the
// same project. Nothing here runs unless the user has connected it.
// ============================================================
let SYNC_CONFIG = JSON.parse(localStorage.getItem("farmwise:firebase-config") || "null");
let syncConnected = false;
let syncError = null;
let db = null;
let farmsSyncUnsub = null;
let dataSyncUnsubs = [];

function detachDataSyncListeners() { dataSyncUnsubs.forEach(u => { try { u(); } catch(e) {} }); dataSyncUnsubs = []; }
function detachAllSyncListeners() { detachDataSyncListeners(); if (farmsSyncUnsub) { try { farmsSyncUnsub(); } catch(e) {} farmsSyncUnsub = null; } }

function connectSync(config, { silent } = {}) {
  try {
    firebase.initializeApp(config);
    db = firebase.firestore();
    db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
    syncConnected = true;
    syncError = null;
    SYNC_CONFIG = config;
    localStorage.setItem("farmwise:firebase-config", JSON.stringify(config));
    reconcileFarmsWithCloud();
    if (currentFarmId) reconcileFarmDataWithCloud(currentFarmId);
    render();
    return true;
  } catch (e) {
    syncConnected = false;
    syncError = String(e && e.message || e);
    if (!silent) render();
    return false;
  }
}
function disconnectSync() {
  detachAllSyncListeners();
  syncConnected = false;
  db = null;
  localStorage.removeItem("farmwise:firebase-config");
  render();
}

function reconcileFarmsWithCloud() {
  if (!syncConnected) return;
  const col = db.collection("farms_registry");
  // Push any locally-created farms up to the cloud if they're not there yet
  col.get().then(snap => {
    const cloudIds = new Set(snap.docs.map(d => d.id));
    const batch = db.batch();
    let hasWrites = false;
    FARMS.forEach(f => {
      if (!cloudIds.has(f.id)) { batch.set(col.doc(f.id), { name: f.name, createdAt: firebase.firestore.FieldValue.serverTimestamp() }); hasWrites = true; }
    });
    return hasWrites ? batch.commit() : null;
  }).catch(e => console.error("farms reconcile push failed:", e))
  .finally(() => {
    if (farmsSyncUnsub) farmsSyncUnsub();
    farmsSyncUnsub = col.onSnapshot(snap => {
      const cloudFarms = snap.docs.map(d => ({ id: d.id, name: (d.data()||{}).name || "" }));
      const localOnly = FARMS.filter(f => !cloudFarms.find(c => c.id === f.id));
      FARMS = [...cloudFarms, ...localOnly];
      localStorage.setItem("farmwise:farms", JSON.stringify(FARMS));
      render();
    }, e => console.error("farms listener error:", e));
  });
}

function reconcileFarmDataWithCloud(id) {
  if (!syncConnected) return;
  detachDataSyncListeners();
  Object.entries(KEYS).forEach(([field, suffix]) => {
    const ref = db.collection("farms_registry").doc(id).collection("data").doc(suffix);
    ref.get().then(docSnap => {
      if (docSnap.exists) {
        // Cloud already has data for this field — it wins on first connect.
        const val = (docSnap.data() || {}).value;
        if (field === "settings") S.settings = Object.assign({}, DEFAULT_SETTINGS, val || {});
        else if (field === "bandi") S.bandi = val || DEFAULT_BANDI;
        else S[field] = val || [];
        localStorage.setItem(farmStorageKey(suffix), JSON.stringify(S[field]));
        render();
      } else {
        // Nothing in the cloud yet for this field — upload what's local.
        ref.set({ value: S[field], updatedAt: firebase.firestore.FieldValue.serverTimestamp() }).catch(e => console.error("initial upload failed:", suffix, e));
      }
    }).catch(e => console.error("reconcile get failed:", suffix, e))
    .finally(() => {
      const unsub = ref.onSnapshot(docSnap => {
        if (!docSnap.exists) return;
        const val = (docSnap.data() || {}).value;
        if (field === "settings") S.settings = Object.assign({}, DEFAULT_SETTINGS, val || {});
        else if (field === "bandi") S.bandi = val || DEFAULT_BANDI;
        else S[field] = val || [];
        localStorage.setItem(farmStorageKey(suffix), JSON.stringify(S[field]));
        render();
      }, e => console.error("data listener error:", suffix, e));
      dataSyncUnsubs.push(unsub);
    });
  });
}

// save() always writes locally first (instant, works offline), then also
// pushes to the cloud if sync is connected.
function save(suffix, value) {
  try { localStorage.setItem(farmStorageKey(suffix), JSON.stringify(value)); } catch(e) { console.error(e); }
  if (syncConnected && currentFarmId) {
    db.collection("farms_registry").doc(currentFarmId).collection("data").doc(suffix)
      .set({ value, updatedAt: firebase.firestore.FieldValue.serverTimestamp() })
      .catch(e => console.error("cloud save failed:", suffix, e));
  }
}

// ---- Multi-farmer registry (not tied to any single farm's data) ----
let FARMS = JSON.parse(localStorage.getItem("farmwise:farms") || "[]");
let currentFarmId = localStorage.getItem("farmwise:last-farm") || null;
if (currentFarmId && !FARMS.find(f => f.id === currentFarmId)) currentFarmId = null;

let APP_LANG = localStorage.getItem("farmwise:app-language") || "en";
function lang() { return APP_LANG === "ur" ? "ur" : "en"; }
function setLanguage(l) { APP_LANG = l; localStorage.setItem("farmwise:app-language", l); render(); }

let S = { bandi: DEFAULT_BANDI, rates: [], animals: [], ledger: [], feedItems: [], feedUsage: [], medical: [], tests: [],
  parties: [], payments: [], feedPurchases: [], settings: DEFAULT_SETTINGS, tab: "dashboard" };
let UI = { choosingKey: null };

function loadFarmData() {
  S = {
    bandi: load(KEYS.bandi, DEFAULT_BANDI), rates: load(KEYS.rates, []), animals: load(KEYS.animals, []),
    ledger: load(KEYS.ledger, []), feedItems: load(KEYS.feedItems, []), feedUsage: load(KEYS.feedUsage, []),
    medical: load(KEYS.medical, []), tests: load(KEYS.tests, []),
    parties: load(KEYS.parties, []), payments: load(KEYS.payments, []), feedPurchases: load(KEYS.feedPurchases, []),
    settings: Object.assign({}, DEFAULT_SETTINGS, load(KEYS.settings, {})),
    tab: "dashboard",
  };
}
function openFarm(id) {
  currentFarmId = id;
  localStorage.setItem("farmwise:last-farm", id);
  UI.choosingKey = null;
  loadFarmData();
  render();
  if (syncConnected) reconcileFarmDataWithCloud(id);
}
function switchFarmer() {
  detachDataSyncListeners();
  currentFarmId = null;
  render();
}
function addFarm() {
  const input = document.getElementById("newFarmerName");
  const name = input ? input.value.trim() : "";
  if (!name) return;
  const id = uid();
  FARMS = [...FARMS, { id, name }];
  localStorage.setItem("farmwise:farms", JSON.stringify(FARMS));
  if (syncConnected) {
    db.collection("farms_registry").doc(id).set({ name, createdAt: firebase.firestore.FieldValue.serverTimestamp() })
      .catch(e => console.error("addFarm cloud push failed:", e));
  }
  openFarm(id);
}
function deleteFarm(id, name) {
  if (!confirm(L().confirmDeleteFarm(name))) return;
  Object.values(KEYS).forEach(suffix => localStorage.removeItem(`farmwise:${id}:${suffix}`));
  FARMS = FARMS.filter(f => f.id !== id);
  localStorage.setItem("farmwise:farms", JSON.stringify(FARMS));
  if (currentFarmId === id) {
    detachDataSyncListeners();
    currentFarmId = null;
    localStorage.removeItem("farmwise:last-farm");
  }
  if (syncConnected) {
    const dataCol = db.collection("farms_registry").doc(id).collection("data");
    dataCol.get().then(snap => {
      const batch = db.batch();
      snap.docs.forEach(d => batch.delete(d.ref));
      batch.delete(db.collection("farms_registry").doc(id));
      return batch.commit();
    }).catch(e => console.error("deleteFarm cloud delete failed:", e));
  }
  render();
}
function farmAnimalCount(id) {
  try { return (JSON.parse(localStorage.getItem(`farmwise:${id}:${KEYS.animals}`) || "[]")).length; }
  catch(e) { return 0; }
}

if (currentFarmId) loadFarmData();
if (SYNC_CONFIG) connectSync(SYNC_CONFIG, { silent: true });

const uid = () => Math.random().toString(36).slice(2, 10);
const currency = (n) => (lang()==="ur" ? Math.round(Number(n)||0).toLocaleString("en-IN")+" روپے" : "Rs " + Math.round(Number(n) || 0).toLocaleString("en-IN"));
const esc = (s) => String(s == null ? "" : s).replace(/"/g, "&quot;");
function allowedSpecies() {
  if (S.settings.species === "cow") return ["Cow"];
  if (S.settings.species === "buffalo") return ["Buffalo"];
  return ["Cow", "Buffalo"];
}
function daysAgoStr(n) { const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }

// ================= LANGUAGE PACKS =================
const SPECIES_LABEL = { en: { Cow:"Cow", Buffalo:"Buffalo" }, ur: { Cow:"گائے", Buffalo:"بھینس" } };
const SESSION_LABEL = { en: { Morning:"Morning", Evening:"Evening" }, ur: { Morning:"صبح", Evening:"شام" } };
const STATUS_LABEL = {
  en: { Lactating:"Lactating", Dry:"Dry", Pregnant:"Pregnant", Sick:"Sick", Sold:"Sold", Dead:"Dead" },
  ur: { Lactating:"دودھ دینے والی", Dry:"خشک", Pregnant:"حاملہ", Sick:"بیمار", Sold:"فروخت شدہ", Dead:"مردہ" },
};

// ================= PRICING LOGIC =================
function computeSplit(cfg, mun, extra, marketRate) {
  const given = (Number(mun) || 0) + (Number(extra) || 0) / 40;
  const rate = marketRate || 0;
  let bandiQty, bandiAmount, excessQty, excessAmount;
  if (cfg.pricingMode === "bandi_only") { bandiQty = given; bandiAmount = given*cfg.fixedRate; excessQty = 0; excessAmount = 0; }
  else if (cfg.pricingMode === "market_only") { bandiQty = 0; bandiAmount = 0; excessQty = given; excessAmount = given*rate*(1-cfg.commissionPct/100); }
  else { bandiQty = Math.min(given, cfg.quotaMun); bandiAmount = bandiQty*cfg.fixedRate; excessQty = Math.max(given-cfg.quotaMun,0); excessAmount = excessQty*rate*(1-cfg.commissionPct/100); }
  return { given, bandiQty, bandiAmount, excessQty, excessAmount, total: bandiAmount + excessAmount };
}
function combinedDaily(sortedRates) { return sortedRates.map(r => ({ date: r.date, avg: (r.morning + r.evening) / 2 })); }
function chunkAverage(dailyCombined, size) {
  const out = [];
  for (let i=0;i<dailyCombined.length;i+=size) {
    const slice = dailyCombined.slice(i,i+size);
    out.push({ label: slice.length>1 ? slice[0].date+" \u2192 "+slice[slice.length-1].date : slice[0].date,
      avg: slice.reduce((s,r)=>s+r.avg,0)/slice.length, count: slice.length });
  }
  return out;
}
function monthlyAverages(dailyCombined) {
  const byMonth = {};
  dailyCombined.forEach(r=>{ const m=new Date(r.date).getMonth(); (byMonth[m]=byMonth[m]||[]).push(r); });
  return MONTH_NAMES[lang()].map((name,i)=>{ const e=byMonth[i]; if(!e||!e.length) return {name,hasData:false};
    return {name,hasData:true,count:e.length,avg:e.reduce((s,r)=>s+r.avg,0)/e.length}; });
}
function yearlyAverages(dailyCombined) {
  const byYear = {};
  dailyCombined.forEach(r=>{ const y=new Date(r.date).getFullYear(); (byYear[y]=byYear[y]||[]).push(r); });
  return Object.keys(byYear).sort().map(y => ({ year: y, avg: byYear[y].reduce((s,r)=>s+r.avg,0)/byYear[y].length, count: byYear[y].length }));
}

// ================= CHART HELPERS =================
function lineChart(points, color, w, h) {
  w = w||520; h = h||160;
  if (points.length < 2) return `<div class="empty-chart">${L().notEnoughData}</div>`;
  const pad = 8;
  const max = Math.max(...points.map(p=>p.v), 1), min = Math.min(...points.map(p=>p.v), 0);
  const step = (w-pad*2)/(points.length-1);
  const pts = points.map((p,i)=>{ const x=pad+i*step; const y=h-pad-((p.v-min)/((max-min)||1))*(h-pad*2); return x+","+y; }).join(" ");
  const area = pts + ` ${pad+(points.length-1)*step},${h-pad} ${pad},${h-pad}`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;">
    <polyline points="${area}" fill="${color}" opacity="0.15" />
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" />
  </svg>`;
}
function barChart(points, color, w, h) {
  w = w||520; h = h||160;
  if (points.length === 0) return `<div class="empty-chart">${L().noDataYet}</div>`;
  const pad = 8, gap = 4;
  const max = Math.max(...points.map(p=>Math.abs(p.v)), 1);
  const zero = h/2;
  const bw = (w - pad*2)/points.length - gap;
  const bars = points.map((p,i)=>{
    const x = pad + i*((w-pad*2)/points.length);
    const bh = (Math.abs(p.v)/max) * (h/2 - pad);
    const y = p.v >= 0 ? zero - bh : zero;
    const fill = p.v >= 0 ? color : "#DC2626";
    return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(bh,1)}" fill="${fill}" rx="2"/>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;">
    <line x1="${pad}" y1="${zero}" x2="${w-pad}" y2="${zero}" stroke="#E5E9E8" stroke-width="1"/>
    ${bars}
  </svg>`;
}
function groupedBarChart(points, colorA, colorB, w, h) {
  w = w||520; h = h||160;
  if (points.length === 0) return `<div class="empty-chart">${L().noDataYet}</div>`;
  const pad = 8;
  const max = Math.max(...points.map(p=>Math.max(p.a,p.b)), 1);
  const groupW = (w - pad*2)/points.length;
  const barW = groupW*0.32;
  const bars = points.map((p,i)=>{
    const gx = pad + i*groupW;
    const ah = (p.a/max)*(h-pad*2), bh = (p.b/max)*(h-pad*2);
    return `<rect x="${gx+groupW*0.12}" y="${h-pad-ah}" width="${barW}" height="${ah}" fill="${colorA}" rx="2"/>
            <rect x="${gx+groupW*0.52}" y="${h-pad-bh}" width="${barW}" height="${bh}" fill="${colorB}" rx="2"/>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;">${bars}</svg>`;
}
function pieChart(slices) {
  const total = slices.reduce((s,x)=>s+x.value,0);
  if (total <= 0) return `<div class="empty-chart">${L().noCostDataYet}</div>`;
  let acc = 0;
  const stops = slices.map(sl => { const start = acc/total*360; acc += sl.value; const end = acc/total*360; return `${sl.color} ${start}deg ${end}deg`; }).join(", ");
  const legend = slices.map(sl => `<span><span class="dot" style="background:${sl.color};"></span>${sl.label} — ${currency(sl.value)}</span>`).join("");
  return `<div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap;">
    <div style="width:120px;height:120px;border-radius:50%;background:conic-gradient(${stops});flex-shrink:0;"></div>
    <div class="legend" style="flex-direction:column;gap:8px;">${legend}</div>
  </div>`;
}

function pctTrend(cur, prev, invert) {
  if (!prev) return { txt: "--%", cls: "flat" };
  const pct = ((cur - prev) / prev) * 100;
  const good = invert ? pct < 0 : pct > 0;
  const arrow = pct >= 0 ? "↑" : "↓";
  return { txt: `${arrow} ${Math.abs(pct).toFixed(0)}%`, cls: good ? "up" : "down" };
}
function renderDashboard() {
  const T = L();
  const start = daysAgoStr(30), prevStart = daysAgoStr(60);
  const inRange = (d, from, to) => d >= from && (!to || d < to);

  const ledgerCur = S.ledger.filter(l=>inRange(l.date, start));
  const ledgerPrev = S.ledger.filter(l=>inRange(l.date, prevStart, start));
  const feedCur = S.feedUsage.filter(u=>inRange(u.date, start));
  const feedPrev = S.feedUsage.filter(u=>inRange(u.date, prevStart, start));
  const medCur = S.medical.filter(e=>inRange(e.date, start));
  const medPrev = S.medical.filter(e=>inRange(e.date, prevStart, start));
  const medCost = e => e.vetFee + e.medicines.reduce((s,m)=>s+m.qty*m.unitCost,0);

  const milkLCur = ledgerCur.reduce((s,l)=>s+l.given*40,0);
  const milkLPrev = ledgerPrev.reduce((s,l)=>s+l.given*40,0);
  const revCur = ledgerCur.reduce((s,l)=>s+l.total,0);
  const revPrev = ledgerPrev.reduce((s,l)=>s+l.total,0);
  const feedCostCur = feedCur.reduce((s,u)=>s+u.cost,0);
  const feedCostPrev = feedPrev.reduce((s,u)=>s+u.cost,0);
  const medCostCur = medCur.reduce((s,e)=>s+medCost(e),0);
  const medCostPrev = medPrev.reduce((s,e)=>s+medCost(e),0);
  const netCur = revCur - feedCostCur - medCostCur;
  const marginCur = revCur > 0 ? (netCur/revCur*100) : null;
  const costPerLCur = milkLCur > 0 ? (feedCostCur+medCostCur)/milkLCur : 0;

  const milkTrend = pctTrend(milkLCur, milkLPrev, false);
  const revTrend = pctTrend(revCur, revPrev, false);
  const feedTrend = pctTrend(feedCostCur, feedCostPrev, true);
  const medTrend = pctTrend(medCostCur, medCostPrev, true);

  const milkByDate = {};
  ledgerCur.forEach(l=>{ milkByDate[l.date] = (milkByDate[l.date]||0) + l.given*40; });
  const milkPoints = Object.keys(milkByDate).sort().map(d=>({ label:d, v: milkByDate[d] }));

  const feedByDate = {}; feedCur.forEach(u=>{ feedByDate[u.date]=(feedByDate[u.date]||0)+u.cost; });
  const medByDate = {}; medCur.forEach(e=>{ medByDate[e.date]=(medByDate[e.date]||0)+medCost(e); });
  const revByDate = {}; ledgerCur.forEach(l=>{ revByDate[l.date]=(revByDate[l.date]||0)+l.total; });
  const allDates = [...new Set([...Object.keys(revByDate), ...Object.keys(feedByDate), ...Object.keys(medByDate)])].sort();
  const profitPoints = allDates.map(d => ({ label:d, v: (revByDate[d]||0) - (feedByDate[d]||0) - (medByDate[d]||0) }));

  const weekBuckets = [];
  for (let w=3; w>=0; w--) {
    const wStart = daysAgoStr((w+1)*7), wEnd = daysAgoStr(w*7);
    const rev = S.ledger.filter(l=>inRange(l.date, wStart, wEnd)).reduce((s,l)=>s+l.total,0);
    const cost = S.feedUsage.filter(u=>inRange(u.date, wStart, wEnd)).reduce((s,u)=>s+u.cost,0)
      + S.medical.filter(e=>inRange(e.date, wStart, wEnd)).reduce((s,e)=>s+medCost(e),0);
    weekBuckets.push({ label: `W${4-w}`, a: rev, b: cost });
  }

  const kpi = (badgeClass, icon, value, label, trend) => `
    <div class="kpi-card">
      <div class="kpi-badge" style="background:var(--${badgeClass}-bg);color:var(--${badgeClass});">${icon}</div>
      <div class="kpi-value">${value}</div>
      <div class="kpi-label">${label}</div>
      <div class="kpi-trend ${trend.cls}">${trend.txt}</div>
    </div>`;

  const totalReceivableDash = S.parties.filter(p=>p.type==="buyer").reduce((s,p)=>s+Math.max(partyBalance(p),0),0);
  const totalPayableDash = S.parties.filter(p=>p.type==="supplier").reduce((s,p)=>s+Math.max(partyBalance(p),0),0);

  // ---- What-if pricing scenario: same milk quantities, priced entirely at bandi vs entirely at open market ----
  let bandiAllTotal = 0, marketAllTotal = 0, missingRateCount = 0;
  ledgerCur.forEach(l => {
    const cfg = S.bandi[`${l.species}-${l.session}`];
    bandiAllTotal += l.given * cfg.fixedRate;
    if (l.marketRateUsed != null) {
      marketAllTotal += l.given * l.marketRateUsed * (1 - cfg.commissionPct / 100);
    } else {
      missingRateCount++;
    }
  });
  const scenario = window._pricingScenario || "actual";
  const scenarioIncome = scenario === "bandi_all" ? bandiAllTotal : scenario === "market_all" ? marketAllTotal : revCur;
  const scenarioProfit = scenarioIncome - feedCostCur - medCostCur;
  const scenarioDelta = scenarioIncome - revCur;

  return `
    <div class="kpi-row">
      ${kpi("blue","🥛", milkLCur.toFixed(0)+" "+T.litres, T.kpiTotalMilk, milkTrend)}
      ${kpi("green","Rs", currency(revCur), T.kpiTotalRevenue, revTrend)}
      ${kpi("orange","🌾", currency(feedCostCur), T.kpiFeedCost, feedTrend)}
      ${kpi("red","🩺", currency(medCostCur), T.kpiMedicalCost, medTrend)}
      ${kpi("purple","💳", currency(netCur), T.kpiNetProfit, { txt: marginCur==null?`--% ${T.margin}`:`${marginCur.toFixed(0)}% ${T.margin}`, cls:"flat" })}
      ${kpi("teal","💧", currency(costPerLCur), T.kpiCostPerLiter, { txt:`${T.target}: ${currency(S.settings.targetCostPerLitre)}`, cls:"flat" })}
      ${kpi("green","💰", currency(totalReceivableDash), T.totalOwed, { txt:"", cls:"flat" })}
      ${kpi("red","📤", currency(totalPayableDash), T.totalYouOwe, { txt:"", cls:"flat" })}
    </div>

    ${(S.animals.length===0 && S.ledger.length===0) ? `<div class="note">${T.emptyDashNote}</div>` : ""}

    <h3 class="section">${T.scenarioTitle}</h3>
    <div class="choice">
      <button class="${scenario==='actual'?'active':''}" onclick="window._pricingScenario='actual';render();">${T.scenarioActual}</button>
      <button class="${scenario==='bandi_all'?'active':''}" onclick="window._pricingScenario='bandi_all';render();">${T.scenarioAllBandi}</button>
      <button class="${scenario==='market_all'?'active':''}" onclick="window._pricingScenario='market_all';render();">${T.scenarioAllMarket}</button>
    </div>
    <div class="panel" style="margin-bottom:20px;">
      <div class="kpi-row" style="grid-template-columns:1fr 1fr;margin-bottom:${scenario!=='actual'?'10px':'0'};">
        <div><div class="muted">${T.scenarioIncome}</div><div style="font-size:22px;font-weight:800;">${currency(scenarioIncome)}</div></div>
        <div><div class="muted">${T.scenarioProfit}</div><div style="font-size:22px;font-weight:800;color:var(--sidebar);">${currency(scenarioProfit)}</div></div>
      </div>
      ${scenario!=='actual' ? `<div class="muted" style="font-size:12.5px;color:${scenarioDelta>=0?'var(--green)':'var(--red)'};font-weight:600;">${T.scenarioVsActual(currency(Math.abs(scenarioDelta)), scenarioDelta>=0)}</div>` : ""}
      ${scenario==='market_all' && missingRateCount>0 ? `<div class="muted" style="margin-top:8px;">${T.scenarioMissingRateNote(missingRateCount)}</div>` : ""}
    </div>

    ${renderAlerts()}

    <div class="panel-grid">
      <div class="panel"><h3>${T.chartMilkTrend}</h3>${lineChart(milkPoints.map(p=>({v:p.v})), "#2563EB")}</div>
      <div class="panel"><h3>${T.chartCostBreakdown}</h3>${pieChart([{label:T.kpiFeedCost, value:feedCostCur, color:"#D97706"},{label:T.kpiMedicalCost, value:medCostCur, color:"#DC2626"}])}</div>
    </div>
    <div class="panel-grid">
      <div class="panel"><h3>${T.chartDailyProfit}</h3>${barChart(profitPoints.map(p=>({v:p.v})), "#059669")}</div>
      <div class="panel"><h3>${T.chartRevVsCost}</h3>${groupedBarChart(weekBuckets, "#059669", "#DC2626")}
        <div class="legend"><span><span class="dot" style="background:#059669;"></span>${T.legendRevenue}</span><span><span class="dot" style="background:#DC2626;"></span>${T.legendCosts}</span></div>
      </div>
    </div>
    <div class="muted">${T.footerSummary(S.ledger.length, S.medical.length, S.feedUsage.length, S.animals.length, S.tests.length)}</div>
  `;
}
function renderAlerts() {
  const T = L();
  const cards = [];
  const byTag = {}; S.tests.forEach(t=>{ (byTag[t.tag]=byTag[t.tag]||[]).push(t); });
  Object.entries(byTag).forEach(([tag,arr])=>{
    const sorted=[...arr].sort((a,b)=>a.date>b.date?1:-1);
    if (sorted.length<2) return;
    const prev=sorted[sorted.length-2], last=sorted[sorted.length-1];
    const pct=((last.litres-prev.litres)/prev.litres)*100;
    if (pct <= -S.settings.alertDropPct) {
      cards.push({ cls:"", icon:"🔻", title:T.milkDown(esc(tag), Math.abs(pct).toFixed(0)),
        detail:T.milkChangeDetail(prev.date,prev.litres,last.date,last.litres,T.beyondThreshold(S.settings.alertDropPct)) });
    } else if (pct >= S.settings.alertDropPct) {
      cards.push({ cls:"good", icon:"📈", title:T.milkUp(esc(tag), pct.toFixed(0)),
        detail:T.milkChangeDetail(prev.date,prev.litres,last.date,last.litres,T.goodImprovement) });
    }
  });
  S.feedItems.forEach(f=>{
    if (f.stockKg < S.settings.lowStockKg) {
      cards.push({ cls:"warn", icon:"🌾", title:T.lowStockTitle(esc(f.name)), detail:T.lowStockDetail(f.stockKg.toFixed(1), S.settings.lowStockKg) });
    }
  });
  const lastTestByTag = {};
  S.tests.forEach(t=>{ if (!lastTestByTag[t.tag] || t.date > lastTestByTag[t.tag]) lastTestByTag[t.tag] = t.date; });
  const overdueLimit = daysAgoStr(Math.round(S.settings.testIntervalDays * 1.5));
  S.animals.filter(a=>a.status==="Lactating").forEach(a=>{
    const last = lastTestByTag[a.tag];
    if (!last || last < overdueLimit) {
      cards.push({ cls:"info", icon:"🗓️", title:T.testDueTitle(esc(a.tag)),
        detail: last ? T.testDueDetailWithDate(last, S.settings.testIntervalDays) : T.testDueDetailNone });
    }
  });
  if (!cards.length) return "";
  return `<h3 class="section">${T.alertsTitle(cards.length)}</h3>` + cards.map(c=>`
    <div class="alert ${c.cls}">
      <div style="font-size:12.5px;font-weight:700;">${c.icon} ${c.title}</div>
      <div style="font-size:11.5px;color:var(--text-muted);margin-top:2px;">${c.detail}</div>
    </div>`).join("") + `<div class="divider"></div>`;
}

function backupData() {
  const payload = { _farmwise_backup:true, createdAt:new Date().toISOString(), bandi:S.bandi, rates:S.rates, animals:S.animals,
    ledger:S.ledger, feedItems:S.feedItems, feedUsage:S.feedUsage, medical:S.medical, tests:S.tests,
    parties:S.parties, payments:S.payments, feedPurchases:S.feedPurchases, settings:S.settings };
  const blob = new Blob([JSON.stringify(payload,null,2)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `farmwise-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  alert(L().backupSavedMsg);
}
function restoreData(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch(e) { alert(L().invalidBackup); return; }
    if (!data || !data._farmwise_backup) { alert(L().invalidBackup); return; }
    if (!confirm(L().confirmRestore)) return;
    S.bandi = data.bandi || DEFAULT_BANDI; S.rates = data.rates || []; S.animals = data.animals || [];
    S.ledger = data.ledger || []; S.feedItems = data.feedItems || []; S.feedUsage = data.feedUsage || [];
    S.medical = data.medical || []; S.tests = data.tests || [];
    S.parties = data.parties || []; S.payments = data.payments || []; S.feedPurchases = data.feedPurchases || [];
    S.settings = Object.assign({}, DEFAULT_SETTINGS, data.settings || {});
    save(KEYS.bandi,S.bandi); save(KEYS.rates,S.rates); save(KEYS.animals,S.animals); save(KEYS.ledger,S.ledger);
    save(KEYS.feedItems,S.feedItems); save(KEYS.feedUsage,S.feedUsage); save(KEYS.medical,S.medical);
    save(KEYS.tests,S.tests); save(KEYS.parties,S.parties); save(KEYS.payments,S.payments); save(KEYS.feedPurchases,S.feedPurchases);
    save(KEYS.settings,S.settings);
    alert(L().restoreSuccess); render();
  };
  reader.onerror = () => alert(L().restoreFail);
  reader.readAsText(file);
}

// ================= ACCOUNTS (Receivables & Payables) =================
function partyBalance(party) {
  const paid = S.payments.filter(p => p.partyId === party.id).reduce((s,p) => s + p.amount, 0);
  if (party.type === "buyer") {
    const owed = S.ledger.filter(l => l.buyerId === party.id).reduce((s,l) => s + l.total, 0);
    return owed - paid; // positive = they owe you
  } else {
    const owed = S.feedPurchases.filter(f => f.supplierId === party.id).reduce((s,f) => s + f.cost, 0);
    return owed - paid; // positive = you owe them
  }
}
function renderAccounts() {
  const T = L();
  const buyers = S.parties.filter(p => p.type === "buyer");
  const suppliers = S.parties.filter(p => p.type === "supplier");
  const allParties = S.parties;
  const totalReceivable = buyers.reduce((s,p) => s + Math.max(partyBalance(p), 0), 0);
  const totalPayable = suppliers.reduce((s,p) => s + Math.max(partyBalance(p), 0), 0);

  const partyRow = (p) => {
    const bal = partyBalance(p);
    const label = bal === 0 ? T.settledUp : (p.type === "buyer" ? T.owesYou(currency(Math.abs(bal))) : T.youOwe(currency(Math.abs(bal))));
    const color = bal === 0 ? "var(--text-muted)" : (p.type === "buyer" ? "var(--green)" : "var(--red)");
    return `<div class="row"><div><div style="font-size:13px;font-weight:600;">${esc(p.name)}</div><div style="font-size:12px;color:${color};margin-top:2px;">${label}</div></div><button class="del" onclick="deleteParty('${p.id}')">${T.delete}</button></div>`;
  };

  return `
    <div class="kpi-row" style="grid-template-columns:1fr 1fr;">
      <div class="kpi-card"><div class="kpi-badge" style="background:var(--green-bg);color:var(--green);">💰</div><div class="kpi-value">${currency(totalReceivable)}</div><div class="kpi-label">${T.totalOwed}</div></div>
      <div class="kpi-card"><div class="kpi-badge" style="background:var(--red-bg);color:var(--red);">📤</div><div class="kpi-value">${currency(totalPayable)}</div><div class="kpi-label">${T.totalYouOwe}</div></div>
    </div>

    <div class="card">
      <h3 class="section">${T.addPartyTitle}</h3>
      <div class="grid2">
        <div class="field"><label>${T.partyName}</label><input id="partyName" placeholder="e.g. Ali Traders"></div>
        <div class="field"><label>${T.partyType}</label><select id="partyType"><option value="buyer">${T.buyerType}</option><option value="supplier">${T.supplierType}</option></select></div>
      </div>
      <button class="btn" onclick="addParty()">${T.addPartyBtn}</button>
    </div>

    <div class="card">
      <h3 class="section">${T.buyersTitle}</h3>
      ${buyers.length===0 ? `<div class="empty">${T.noParties}</div>` : buyers.map(partyRow).join("")}
    </div>
    <div class="card">
      <h3 class="section">${T.suppliersTitle}</h3>
      ${suppliers.length===0 ? `<div class="empty">${T.noParties}</div>` : suppliers.map(partyRow).join("")}
    </div>

    <div class="card">
      <h3 class="section">${T.recordPayment}</h3>
      <div class="field"><label>${T.selectParty}</label><select id="paymentParty">
        <option value="">—</option>
        ${allParties.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.type==='buyer'?T.receivedFromBuyer:T.paidToSupplier})</option>`).join("")}
      </select></div>
      <div class="grid2">
        <div class="field"><label>${T.paymentDate}</label><input type="date" id="paymentDate"></div>
        <div class="field"><label>${T.paymentAmount}</label><input type="number" id="paymentAmount"></div>
      </div>
      <button class="btn" onclick="recordPayment()">${T.savePayment}</button>
    </div>
    <div class="card">
      <h3 class="section">${T.paymentLog}</h3>
      ${S.payments.length===0 ? `<div class="empty">${T.noPaymentsYet}</div>` : S.payments.slice(0,60).map(pay => {
        const p = S.parties.find(x=>x.id===pay.partyId);
        return `<div class="row"><div><div style="font-size:13px;">${pay.date} · ${p?esc(p.name):"—"}</div><div style="font-size:11.5px;color:var(--text-muted);">${currency(pay.amount)}</div></div><button class="del" onclick="delPayment('${pay.id}')">${T.delete}</button></div>`;
      }).join("")}
    </div>
  `;
}
function addParty() {
  const name = document.getElementById("partyName").value.trim();
  const type = document.getElementById("partyType").value;
  if (!name) return;
  S.parties = [...S.parties, { id: uid(), name, type }];
  save(KEYS.parties, S.parties);
  render();
}
function deleteParty(id) {
  if (!confirm(L().confirmDeleteParty)) return;
  S.parties = S.parties.filter(p => p.id !== id);
  save(KEYS.parties, S.parties);
  render();
}
function recordPayment() {
  const partyId = document.getElementById("paymentParty").value;
  const date = document.getElementById("paymentDate").value;
  const amount = Number(document.getElementById("paymentAmount").value);
  if (!partyId || !date || !amount) return;
  S.payments = [{ id: uid(), partyId, date, amount }, ...S.payments];
  save(KEYS.payments, S.payments);
  render();
}
function delPayment(id) {
  S.payments = S.payments.filter(p => p.id !== id);
  save(KEYS.payments, S.payments);
  render();
}

// ================= PRINTABLE REPORT =================
function renderReport() {
  const T = L();
  const farm = FARMS.find(f => f.id === currentFarmId);
  const from = window._reportFrom || daysAgoStr(30);
  const to = window._reportTo || daysAgoStr(0);
  const inRange = (d) => d >= from && d <= to;

  const ledgerR = S.ledger.filter(l => inRange(l.date));
  const feedR = S.feedUsage.filter(u => inRange(u.date));
  const medR = S.medical.filter(e => inRange(e.date));
  const medCost = e => e.vetFee + e.medicines.reduce((s,m)=>s+m.qty*m.unitCost,0);

  const milkIncome = ledgerR.reduce((s,l)=>s+l.total,0);
  const bandiIncome = ledgerR.reduce((s,l)=>s+(l.bandiAmount||0),0);
  const marketIncome = ledgerR.reduce((s,l)=>s+(l.excessAmount||0),0);
  const feedCost = feedR.reduce((s,u)=>s+u.cost,0);
  const medCostTotal = medR.reduce((s,e)=>s+medCost(e),0);
  const net = milkIncome - feedCost - medCostTotal;

  const totalReceivable = S.parties.filter(p=>p.type==="buyer").reduce((s,p)=>s+Math.max(partyBalance(p),0),0);
  const totalPayable = S.parties.filter(p=>p.type==="supplier").reduce((s,p)=>s+Math.max(partyBalance(p),0),0);

  const statusCount = (st) => S.animals.filter(a=>a.status===st).length;

  return `
    <div class="grid2" style="margin-bottom:16px;">
      <div class="field"><label>${T.reportFrom}</label><input type="date" value="${from}" onchange="window._reportFrom=this.value;render();"></div>
      <div class="field"><label>${T.reportTo}</label><input type="date" value="${to}" onchange="window._reportTo=this.value;render();"></div>
    </div>
    <div id="printableReport" class="card">
      <div style="text-align:center;margin-bottom:20px;">
        <div style="font-size:20px;font-weight:800;color:var(--sidebar);">🌾 FarmWise</div>
        <div style="font-size:15px;font-weight:700;margin-top:4px;">${T.reportFarmLabel}: ${farm ? esc(farm.name) : ""}</div>
        <div class="muted" style="margin-top:2px;">${T.reportPeriod}: ${from} — ${to} · ${T.reportGenerated} ${daysAgoStr(0)}</div>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <tr><td style="padding:8px 0;border-bottom:1px solid var(--hairline);">${T.reportMilkIncome}</td><td style="padding:8px 0;border-bottom:1px solid var(--hairline);text-align:right;font-weight:700;">${currency(milkIncome)}</td></tr>
        <tr><td style="padding:6px 0 6px 16px;color:var(--text-muted);font-size:12px;">${T.reportFixedRate}</td><td style="padding:6px 0;text-align:right;color:var(--text-muted);font-size:12px;">${currency(bandiIncome)}</td></tr>
        <tr><td style="padding:0 0 8px 16px;color:var(--text-muted);font-size:12px;border-bottom:1px solid var(--hairline);">${T.reportOpenMarket}</td><td style="padding:0 0 8px;text-align:right;color:var(--text-muted);font-size:12px;border-bottom:1px solid var(--hairline);">${currency(marketIncome)}</td></tr>
        <tr><td style="padding:8px 0;border-bottom:1px solid var(--hairline);">${T.reportFeedCost}</td><td style="padding:8px 0;border-bottom:1px solid var(--hairline);text-align:right;color:var(--red);">- ${currency(feedCost)}</td></tr>
        <tr><td style="padding:8px 0;border-bottom:1px solid var(--hairline);">${T.reportMedicalCost}</td><td style="padding:8px 0;border-bottom:1px solid var(--hairline);text-align:right;color:var(--red);">- ${currency(medCostTotal)}</td></tr>
        <tr><td style="padding:10px 0;font-weight:800;">${T.reportNetProfit}</td><td style="padding:10px 0;text-align:right;font-weight:800;color:var(--sidebar);">${currency(net)}</td></tr>
      </table>
      <div class="divider"></div>
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <tr><td style="padding:6px 0;">${T.reportReceivables}</td><td style="padding:6px 0;text-align:right;color:var(--green);font-weight:700;">${currency(totalReceivable)}</td></tr>
        <tr><td style="padding:6px 0;">${T.reportPayables}</td><td style="padding:6px 0;text-align:right;color:var(--red);font-weight:700;">${currency(totalPayable)}</td></tr>
      </table>
      <div class="divider"></div>
      <h3 class="section">${T.reportHerd}</h3>
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <tr><td style="padding:5px 0;">${T.reportTotalAnimals}</td><td style="padding:5px 0;text-align:right;font-weight:700;">${S.animals.length}</td></tr>
        <tr><td style="padding:5px 0;">${T.reportLactating}</td><td style="padding:5px 0;text-align:right;">${statusCount("Lactating")}</td></tr>
        <tr><td style="padding:5px 0;">${T.reportDry}</td><td style="padding:5px 0;text-align:right;">${statusCount("Dry")}</td></tr>
        <tr><td style="padding:5px 0;">${T.reportPregnant}</td><td style="padding:5px 0;text-align:right;">${statusCount("Pregnant")}</td></tr>
        <tr><td style="padding:5px 0;">${T.reportSick}</td><td style="padding:5px 0;text-align:right;">${statusCount("Sick")}</td></tr>
      </table>
      <div class="muted" style="text-align:center;margin-top:20px;">${T.reportFooter}</div>
    </div>
  `;
}

render();
</script>
</body>
</html>
